<!DOCTYPE html>
<html lang="ko">
<head>

<style>

  .theme-toggle{
    background:transparent;
    border:none;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    padding:0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, var(--bg-deep), var(--bg) 60%);
    font-family:var(--font-body);
    color:var(--ink);

    display:flex;
    justify-content:center;
    padding:32px 16px;
  }
  .app{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  header.top{
    display:flex;
    align-items:flex-start;

  header.top h1{
    font-family:var(--font-title);

  .header-right{

  /* 세그먼트 탭 */
  .tabs{
    display:flex;
    gap:4px;
    padding:4px;
    background:var(--bg-deep);
    border-radius:14px;

  .tab{

  }
  .tab.active{
    background:var(--card);

  }

  .page{
    background:transparent;

  }

  /* 입력 폼 */
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:500;
  }
  .field input, .field textarea, .field select{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    font-family:'Noto Sans KR', sans-serif;
    font-size:15px;
    color:var(--ink);

  .field textarea{ resize:vertical; min-height:50px; line-height:33px; }
  .field input:focus, .field textarea:focus, .field select:focus{ border-bottom:1px solid var(--gold-deep); }

  .btn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:20px;
    border:none;

  .btn:active{ transform:scale(0.96); }
  .btn-primary{ background:var(--ink); color:#F7F6F2; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-row{ display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }

  /* 리스트 - 카드형 */
  .empty{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:60px 10px;

  }
  .prayer-list{ display:flex; flex-direction:column; gap:10px; }
  .prayer-item{
    background:var(--card);
    border-radius:16px;

    gap:12px;

    border:1px solid rgba(43,50,68,0.04);

  .check{

    border-radius:50%;

    margin-top:1px;

  .check.done{ background:var(--gold); color:#fff; border-color:var(--gold-deep); }

  /* 기도 모드 (카드) */

  .pray-count{ font-size:12px; color:var(--ink-soft); }
  .pray-card{
    width:100%;
    min-height:260px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;

    flex-direction:column;

    text-align:center;

    0%{ transform:scale(2.2) rotate(-8deg); opacity:0; }

  /* 수정/입력 모달 */

    position:fixed; inset:0;
    background:rgba(43,50,68,0.5);
    display:flex; align-items:center; justify-content:center;

    width:100%;
    max-width:440px;
    max-height:88vh;
    overflow-y:auto;
    background:var(--card);
    border-radius:14px;
    border:1px solid var(--line);
    padding:22px 20px;
    box-shadow:0 20px 50px rgba(43,50,68,0.3);
  }
  .modal-title{
    font-family:var(--font-title);
    font-weight:700;
    font-size:18px;
    margin:0 0 16px;
  }
  .modal-hint{
    font-size:12px;
    color:var(--gold-deep);
    margin:-8px 0 16px;
  }
  .icon-btn{
    background:transparent;
    border:none;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-soft);
    padding:2px 6px;
  }

  .item-actions{ display:flex; gap:2px; margin-left:auto; flex-shrink:0; }
  .pray-card-edit{
    position:absolute;
    top:10px; right:10px;

  /* 기도 집중 모드 (타이머 숨김 + 배경음) */
  .focus-screen{
    position:fixed; inset:0;
    background: radial-gradient(circle at 50% 38%, #3A4358, #1B2028 78%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:34px;
    z-index:80;
    color:#EDEFF5;
    text-align:center;
    padding:24px;
    animation: focusFadeIn .6s ease;
  }
  @keyframes focusFadeIn{ from{ opacity:0; } to{ opacity:1; } }
  .focus-title{
    font-family:var(--font-title);
    font-size:17px;
    opacity:0.9;
    letter-spacing:0.5px;
    max-width:320px;
    line-height:1.5;
  }
  .breathe-circle{
    width:130px; height:130px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(200,155,60,0.55), rgba(200,155,60,0.04) 72%);

  .focus-hint{ font-size:12.5px; opacity:0.55; letter-spacing:0.5px; }
  .focus-end-btn{

    border:1px solid rgba(237,239,245,0.32);

</style>

<body>

<div class="app" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzmcte3epgkssf7GXkE5CZYLIn45M-oYQ",
  authDomain: "prayer-9a81b.firebaseapp.com",
  projectId: "prayer-9a81b",
  storageBucket: "prayer-9a81b.firebasestorage.app",
  messagingSenderId: "1029201261080",
  appId: "1:1029201261080:web:59f7e4ee5d75d266ee896d"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
const prayersCol = collection(db, "prayers");

// 아래 함수들에서 window.* 로 노출해두면 onclick="..." 에서 바로 호출할 수 있어요.
window.setTab = setTab;
window.setFilter = setFilter;
window.prevCard = prevCard;
window.nextCard = nextCard;
window.toggleDone = toggleDone;
window.markAnsweredFlow = markAnsweredFlow;
window.confirmAnswer = confirmAnswer;
window.openAddModal = openAddModal;
window.openEditModal = openEditModal;
window.closeModal = closeModal;
window.saveModal = saveModal;
window.deletePrayer = deletePrayer;
window.doLogin = doLogin;
window.doLogout = doLogout;
window.toggleDarkMode = toggleDarkMode;
window.startPrayFocus = startPrayFocus;
window.endPrayFocus = endPrayFocus;
window.closeVerse = closeVerse;

const CATS = ["가족","건강","사역","재정","관계","기타"];
const CAT_COLORS = {
  "가족": "#E28B7D",
  "건강": "#5FA88A",
  "사역": "#7B8FD6",
  "재정": "#D6A14A",
  "관계": "#C87FB0",
  "기타": "#9AA0AE",
};
function catDot(cat){
  return `<span class="tag-dot" style="background:${CAT_COLORS[cat]||'#9AA0AE'};"></span>`;
}

let state = {
  tab: "home",
  filter: "ongoing",
  prayers: [],
  loaded: false,
  playIndex: 0,
  showSeal: null, // prayer object being sealed
  modal: null, // { mode: 'edit' | 'answer', id: string|null }
  user: null,
  authChecked: false,
  loginError: "",
  prayFocus: null, // { id, startedAt, mode: 'normal' | 'thanks' }
  showPrayTime: null, // 방금 기도한 시간(초) - 저장용, 팝업엔 안 씀
  showVerse: null, // 기도 마칠 때 보여줄 말씀 구절
  afterVerseAction: null, // 말씀 카드를 닫은 뒤 이어서 할 일 (예: 응답 상세 입력 모달 열기)
  darkMode: (function(){ try{ return localStorage.getItem('prayerAppDark') === '1'; }catch(e){ return false; } })(),
};

function toggleDarkMode(){
  state.darkMode = !state.darkMode;
  try{ localStorage.setItem('prayerAppDark', state.darkMode ? '1' : '0'); }catch(e){}
  render();
}

let unsubscribePrayers = null;

onAuthStateChanged(auth, (user) => {
  state.user = user;
  state.authChecked = true;
  if(user){
    subscribeToPrayers();
  } else {
    if(!bgAudio.paused) bgAudio.pause();
    if(unsubscribePrayers){
      unsubscribePrayers();
      unsubscribePrayers = null;
    }
    state.prayers = [];
    state.loaded = false;
  }
  render();
});

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  state.loginError = "";
  try{
    await signInWithEmailAndPassword(auth, email, pw);
  }catch(e){
    console.error(e);
    state.loginError = "로그인에 실패했어요. 이메일/비밀번호를 확인해주세요.";
    render();
  }
}

function doLogout(){
  signOut(auth);
}

function subscribeToPrayers(){
  const q = query(prayersCol, orderBy("createdAtSort", "desc"));
  unsubscribePrayers = onSnapshot(q, (snapshot) => {
    state.prayers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loaded = true;
    render();
  }, (err) => {
    console.error("Firestore 읽기 오류:", err);
    state.loaded = true;
    render();
  });
}

/* ---- 배경음: 직접 올린 mp3 파일 3개 중 랜덤 재생 (유튜브 대신, 광고/자동재생 문제 없음) ---- */
const BG_FILES = ["bgm.mp3", "bgm2.mp3", "bgm3.mp3"];
const bgAudio = new Audio();
bgAudio.loop = true;
bgAudio.preload = 'auto';
bgAudio.volume = 0;

const PRAY_VOLUME = 0.45; // 0~1
let fadeInterval = null;

function fadeVolume(targetVol, durationMs, onDone){
  if(fadeInterval){ clearInterval(fadeInterval); fadeInterval = null; }
  const startVol = bgAudio.volume;
  const steps = Math.max(1, Math.round(durationMs / 100));
  let i = 0;
  fadeInterval = setInterval(() => {
    i++;
    const vol = startVol + (targetVol - startVol) * (i / steps);
    bgAudio.volume = Math.max(0, Math.min(1, vol));
    if(i >= steps){
      clearInterval(fadeInterval);
      fadeInterval = null;
      if(onDone) onDone();
    }
  }, 100);
}

// "기도하기" 클릭 -> 그 즉시 재생을 시작하면서 볼륨 0에서 10초에 걸쳐 서서히 키움
function startAmbient(){
  bgAudio.src = BG_FILES[Math.floor(Math.random() * BG_FILES.length)];
  bgAudio.currentTime = 0;
  bgAudio.volume = 0;
  bgAudio.play().catch(e => console.error('배경음 재생 실패', e));
  fadeVolume(PRAY_VOLUME, 10000);
}

// "기도를 마쳤어요" 클릭 -> 말씀을 읽는 동안 10초에 걸쳐 서서히 줄어들다 멈춤
function stopAmbient(){
  fadeVolume(0, 10000, () => {
    bgAudio.pause();
  });
}

/* ---- 기도 집중 모드 ---- */
const VERSES = [
  // 기도에 관하여
  { ref: "빌립보서 4:6-7", text: "아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라." },
  { ref: "마태복음 6:6", text: "너는 기도할 때에 네 골방에 들어가 문을 닫고 은밀한 중에 계신 네 아버지께 기도하라." },
  { ref: "예레미야 33:3", text: "너는 내게 부르짖으라 내가 네게 응답하겠고 네가 알지 못하는 크고 은밀한 일을 네게 보이리라." },

function startPrayFocus(id, mode){
  state.prayFocus = { id, startedAt: Date.now(), mode: mode || 'normal' };
  render();
  startAmbient();
}

async function endPrayFocus(){
  if(!state.prayFocus) return;
  const { id, startedAt } = state.prayFocus;
  const elapsedSec = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
  stopAmbient();
  state.prayFocus = null;
  state.showPrayTime = elapsedSec;
  state.showVerse = VERSES[Math.floor(Math.random() * VERSES.length)];
  render();

  const p = state.prayers.find(x=>x.id===id);
  const newTotal = (p && p.totalPrayedSeconds ? p.totalPrayedSeconds : 0) + elapsedSec;
  try{
    await updateDoc(doc(db, "prayers", id), { totalPrayedSeconds: newTotal });
  }catch(e){ console.error(e); }
}

function closeVerse(){
  state.showVerse = null;
  state.showPrayTime = null;
  const action = state.afterVerseAction;
  state.afterVerseAction = null;
  if(action && action.type === 'openAnswerModal'){
    state.modal = { mode: 'answer', id: action.id };
  }
  render();
}

function formatDuration(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  if(m<=0) return `${s}초`;
  if(s===0) return `${m}분`;
  return `${m}분 ${s}초`;
}

function render(){
  const root = document.getElementById('app');
  document.body.classList.toggle('dark', state.darkMode);

  if(!state.authChecked){
    root.innerHTML = `<div class="empty" style="padding-top:120px;">불러오는 중…</div>`;
    return;
  }

  if(!state.user){
    root.innerHTML = renderLogin();
    return;
  }

  if(state.prayFocus){
    root.innerHTML = renderPrayFocusScreen();
    return;
  }

  root.innerHTML = `
    <header class="top">
      <h1>기도의 자리</h1>
      <div class="header-right">
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="date">${todayLabel()}</span>
          <button class="theme-toggle" onclick="toggleDarkMode()" title="${state.darkMode ? '라이트 모드' : '다크 모드'}">${state.darkMode ? '☀️' : '🌙'}</button>
        </div>
        <button class="logout-btn" onclick="doLogout()">로그아웃</button>
      </div>
    </header>
    <div class="tabs">
      ${tab('home','목록')}
      ${tab('pray','기도 모드')}
      ${tab('answered','응답 기록')}
    </div>
    <div class="page">
      ${state.tab === 'home' ? renderHome() : ''}
      ${state.tab === 'pray' ? renderPrayMode() : ''}
      ${state.tab === 'answered' ? renderAnswered() : ''}
    </div>
    ${state.tab === 'home' ? `<button class="fab" onclick="openAddModal()">+</button>` : ''}
    ${state.showSeal ? renderSeal() : ''}
    ${state.showVerse ? renderVerseOverlay() : ''}
    ${state.modal ? renderModal() : ''}
  `;
}

function renderPrayFocusScreen(){
  const p = state.prayers.find(x=>x.id===state.prayFocus.id);
  const isThanks = state.prayFocus.mode === 'thanks';
  const hint = isThanks
    ? "이 기도에 응답해 주신 것을 떠올리며, 감사한 마음을 올려드리세요"
    : "숨을 고르며, 이 마음을 하나님께 올려드리세요";
  return `
    <div class="focus-screen">
      <div class="focus-title">${p ? escapeHtml(p.title) : ''}</div>
      <div class="breathe-circle"></div>
      <div class="focus-hint">${hint}</div>
      <button class="focus-end-btn" onclick="endPrayFocus()">기도를 마쳤어요</button>
    </div>
  `;
}

function renderVerseOverlay(){
  const v = state.showVerse;
  return `
    <div class="seal-overlay" onclick="if(event.target===this) closeVerse()">
      <div class="verse-card">
        <div class="verse-mark">"</div>
        <p class="verse-text">${escapeHtml(v.text)}</p>
        <div class="verse-ref">${escapeHtml(v.ref)}</div>
        <button class="btn btn-primary" onclick="closeVerse()" style="margin-top:18px;">아멘</button>
      </div>
    </div>
  `;
}

function renderLogin(){
  return `
    <div class="page" style="margin-top:80px; min-height:auto; background-image:none;">
      <div class="modal-title" style="text-align:center;">기도의 자리</div>
      <div class="modal-hint" style="text-align:center;">로그인하고 나의 기도 제목을 확인하세요</div>
      <div class="field">
        <label>이메일</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      ${state.loginError ? `<div style="color:var(--rose); font-size:12px; margin-bottom:12px;">${escapeHtml(state.loginError)}</div>` : ''}
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="doLogin()">로그인</button>
      </div>
    </div>
  `;
}

function tab(key, label){
  return `<div class="tab ${state.tab===key?'active':''}" onclick="setTab('${key}')">${label}</div>`;
}

function setTab(key){
  state.tab = key;
  state.playIndex = 0;
  render();
}

function todayLabel(){
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function renderHome(){
  const list = state.prayers.filter(p => state.filter==='ongoing' ? !p.done : p.done);
  const filters = `
    <div class="filters">
      <div class="filter-pill ${state.filter==='ongoing'?'active':''}" onclick="setFilter('ongoing')">기도 중</div>
      <div class="filter-pill ${state.filter==='done'?'active':''}" onclick="setFilter('done')">응답됨</div>
    </div>
  `;
  if(!state.loaded){
    return filters + `<div class="empty">불러오는 중…</div>`;
  }
  if(list.length===0){
    return filters + `<div class="empty">아직 기록된 기도 제목이 없어요.<br>우측 아래 + 를 눌러 첫 기도 제목을 적어보세요.</div>`;
  }
  return filters + `<div class="prayer-list">` + list.map(p => `
    <div class="prayer-item">
      <div class="check ${p.done?'done':''}" onclick="toggleDone('${p.id}')">${p.done?'✓':''}</div>
      <div class="prayer-body">
        <div class="prayer-title ${p.done?'done':''}">${escapeHtml(p.title)}</div>
        <div class="prayer-content-preview">${escapeHtml(p.content||'')}</div>
        <div class="prayer-tag">${catDot(p.cat)}${p.cat}</div>
        <div class="prayer-meta">${p.createdAt} 시작${p.done ? ' · '+p.answeredAt+' 응답' : ''}${p.totalPrayedSeconds ? ' · 총 '+formatDuration(p.totalPrayedSeconds)+' 기도' : ''}</div>
      </div>
      <div class="item-actions">
        <button class="icon-btn" onclick="openEditModal('${p.id}')" title="수정">✎</button>
      </div>
    </div>
  `).join('') + `</div>`;
}

function setFilter(f){ state.filter = f; render(); }

function renderAnswered(){
  const list = state.prayers.filter(p=>p.done);
  if(!state.loaded){
    return `<div class="empty">불러오는 중…</div>`;
  }
  if(list.length===0){
    return `<div class="empty">아직 응답된 기도가 없어요.<br>응답되면 이곳에 감사의 기록으로 쌓여요.</div>`;
  }
  return `<div class="prayer-list">` + list.map(p => `
    <div class="prayer-item">
      <div class="check done">✓</div>
      <div class="prayer-body">
        <div class="prayer-title">${escapeHtml(p.title)}</div>
        <div class="prayer-meta">${p.createdAt} → ${p.answeredAt} 응답${p.totalPrayedSeconds ? ' · 총 '+formatDuration(p.totalPrayedSeconds)+' 기도' : ''}</div>
        ${p.answerNote ? `<div class="prayer-content-preview">"${escapeHtml(p.answerNote)}"</div>` : ''}
        <div class="prayer-tag">${catDot(p.cat)}${p.cat}</div>
      </div>
    </div>
  `).join('') + `</div>`;
}

function renderPrayMode(){
  const ongoing = state.prayers.filter(p=>!p.done);
  if(!state.loaded){
    return `<div class="empty">불러오는 중…</div>`;
  }
  if(ongoing.length===0){
    return `<div class="empty">지금 기도 중인 제목이 없어요.<br>목록 탭에서 기도 제목을 추가해보세요.</div>`;
  }
  if(state.playIndex >= ongoing.length) state.playIndex = 0;
  const p = ongoing[state.playIndex];
  return `
    <div class="pray-mode">
      <div class="pray-count">${state.playIndex+1} / ${ongoing.length}</div>
      <div class="pray-card">
        <div class="eyebrow">${p.cat} · ${p.createdAt}</div>
        <h2>${escapeHtml(p.title)}</h2>
        <p>${escapeHtml(p.content||'')}</p>
        ${p.totalPrayedSeconds ? `<div class="pray-total">지금까지 총 ${formatDuration(p.totalPrayedSeconds)} 기도했어요</div>` : ''}
      </div>
      <button class="btn btn-primary pray-start-btn" onclick="startPrayFocus('${p.id}')">🕊 기도하기</button>
      <div class="pray-nav">
        <button class="nav-btn" onclick="prevCard(${ongoing.length})">‹</button>
        <button class="btn btn-ghost" onclick="markAnsweredFlow('${p.id}')">응답됨으로 표시</button>
        <button class="nav-btn" onclick="nextCard(${ongoing.length})">›</button>
      </div>
    </div>
  `;
}

function prevCard(len){ state.playIndex = (state.playIndex-1+len)%len; render(); }
function nextCard(len){ state.playIndex = (state.playIndex+1)%len; render(); }

async function toggleDone(id){
  const p = state.prayers.find(x=>x.id===id);
  if(!p) return;
  if(!p.done){ markAnsweredFlow(id); return; }
  try{
    await updateDoc(doc(db, "prayers", id), { done:false, answeredAt:null, answerNote:null });
  }catch(e){ console.error(e); alert('저장 중 오류가 발생했어요'); }
}

// 응답됨으로 표시 -> 간증/결과를 적는 모달을 먼저 띄움
// 응답됨으로 표시하기 전에, 먼저 감사 기도 시간을 갖는다.
// 기도를 마치면(말씀 카드까지 닫으면) 자동으로 응답 상세 입력 모달로 이어진다.
function markAnsweredFlow(id){
  state.afterVerseAction = { type: 'openAnswerModal', id };
  startPrayFocus(id, 'thanks');
}

async function confirmAnswer(id){
  const p = state.prayers.find(x=>x.id===id);
  if(!p) return;
  const note = document.getElementById('m-answer-note').value.trim();
  const dateVal = document.getElementById('m-answer-date').value;
  const answeredAt = dateVal ? formatDateInput(dateVal) : todayLabel();
  state.modal = null;
  state.showSeal = { ...p, answeredAt };
  render();
  setTimeout(()=>{ state.showSeal = null; render(); }, 1400);
  try{
    await updateDoc(doc(db, "prayers", id), { done:true, answeredAt, answerNote: note });
  }catch(e){ console.error(e); alert('저장 중 오류가 발생했어요'); }
}

function renderSeal(){
  return `
    <div class="seal-overlay">
      <div class="seal">응답<br>${state.showSeal.answeredAt}</div>
    </div>
  `;
}

/* ---- 추가 / 수정 / 응답 기록 모달 ---- */

function openAddModal(){
  state.modal = { mode: 'edit', id: null };
  render();
}

function openEditModal(id){
  state.modal = { mode: 'edit', id };
  render();
}

function closeModal(){
  state.modal = null;
  render();
}

function renderModal(){
  const { mode, id } = state.modal;
  if(mode === 'answer'){
    const p = state.prayers.find(x=>x.id===id);
    return `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal-box">
          <div class="modal-title">응답 기록 남기기</div>
          <div class="modal-hint">"${escapeHtml(p.title)}"에 대한 간증이나 결과를 적어주세요</div>
          <div class="field">
            <label>응답 날짜</label>
            <input type="date" id="m-answer-date" value="${toDateInputValue(new Date())}">
          </div>
          <div class="field">
            <label>간증 / 결과 (선택)</label>
            <textarea id="m-answer-note" rows="4" placeholder="어떻게 응답되었는지 자유롭게 적어보세요"></textarea>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" onclick="closeModal()">취소</button>
            <button class="btn btn-primary" onclick="confirmAnswer('${id}')">응답 도장 찍기</button>
          </div>
        </div>
      </div>
    `;
  }

  // mode === 'edit' (추가 또는 수정)
  const p = id ? state.prayers.find(x=>x.id===id) : null;
  const isNew = !p;
  const catOptions = CATS.map(c => `<option value="${c}" ${p && p.cat===c ? 'selected':''}>${c}</option>`).join('');
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-box">
        <div class="modal-title">${isNew ? '기도 제목 추가' : '기도 제목 수정'}</div>
        <div class="field">
          <label>제목</label>
          <input type="text" id="m-title" value="${p ? escapeAttr(p.title) : ''}" placeholder="예) 아버지 건강 회복">
        </div>
        <div class="field">
          <label>내용</label>
          <textarea id="m-content" rows="3" placeholder="조금 더 자세히 적어주세요">${p ? escapeHtml(p.content||'') : ''}</textarea>
        </div>
        <div class="field">
          <label>카테고리</label>
          <select id="m-cat">${catOptions}</select>
        </div>
        <div class="field">
          <label>시작일</label>
          <input type="date" id="m-created" value="${p ? toDateInputValue(parseLabelDate(p.createdAt)) : toDateInputValue(new Date())}">
        </div>
        ${p && p.done ? `
        <div class="field">
          <label>응답 날짜</label>
          <input type="date" id="m-answered" value="${toDateInputValue(parseLabelDate(p.answeredAt))}">
        </div>
        <div class="field">
          <label>간증 / 결과</label>
          <textarea id="m-answernote" rows="3">${escapeHtml(p.answerNote||'')}</textarea>
        </div>
        ` : ''}
        <div class="btn-row">
          ${!isNew ? `<button class="btn btn-ghost" onclick="deletePrayer('${id}')" style="margin-right:auto;color:var(--rose);">삭제</button>` : ''}
          <button class="btn btn-ghost" onclick="closeModal()">취소</button>
          <button class="btn btn-primary" onclick="saveModal(${isNew ? 'null' : `'${id}'`})">저장</button>
        </div>
      </div>
    </div>
  `;
}

async function saveModal(id){
  const title = document.getElementById('m-title').value.trim();
  if(!title){ alert('기도 제목을 입력해주세요'); return; }
  const content = document.getElementById('m-content').value.trim();
  const cat = document.getElementById('m-cat').value;
  const createdVal = document.getElementById('m-created').value;
  const createdAt = createdVal ? formatDateInput(createdVal) : todayLabel();
  const createdAtSort = createdVal || toDateInputValue(new Date());

  const p = id !== null ? state.prayers.find(x=>x.id===id) : null;
  const update = { title, content, cat, createdAt, createdAtSort };
  if(p && p.done){
    const answeredVal = document.getElementById('m-answered').value;
    update.answeredAt = answeredVal ? formatDateInput(answeredVal) : p.answeredAt;
    update.answerNote = document.getElementById('m-answernote').value.trim();
  }

  state.modal = null;
  render();

  try{
    if(id === null){
      await addDoc(prayersCol, { title, content, cat, createdAt, createdAtSort, done:false, answeredAt:null, answerNote:null });
    } else {
      await updateDoc(doc(db, "prayers", id), update);
    }
  }catch(e){ console.error(e); alert('저장 중 오류가 발생했어요'); }
}

async function deletePrayer(id){
  if(!confirm('이 기도 제목을 삭제할까요?')) return;
  state.modal = null;
  render();
  try{
    await deleteDoc(doc(db, "prayers", id));
  }catch(e){ console.error(e); alert('삭제 중 오류가 발생했어요'); }
}

/* ---- 날짜 유틸 ---- */
function toDateInputValue(d){
  if(!(d instanceof Date) || isNaN(d)) d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateInput(val){
  const [y,m,d] = val.split('-');
  return `${y}.${m}.${d}`;
}
function parseLabelDate(label){
  if(!label) return new Date();
  const [y,m,d] = label.split('.').map(Number);
  return new Date(y, (m||1)-1, d||1);
}
function escapeAttr(str){
  return escapeHtml(str).replace(/"/g,'&quot;');
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

render();
</script>
</body>
</html>
